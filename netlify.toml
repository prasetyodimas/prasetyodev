[build]
  command = "gatsby clean && gatsby build"
  publish = "public"

[[headers]]
  for = "/*"
    [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    # Jalan di onPostBuild supaya report ikut ter-deploy (thresholds kosong = tidak akan fail)
    fail_deploy_on_score_thresholds = "true"
    # Relatif terhadap publish dir, hasilnya: /lighthouse/report.html
    output_path = "lighthouse/report.html"

# Harus setelah plugin lighthouse: mengubah report.html jadi /lighthouse-report.json
# yang dipakai section PageSpeed Insights di homepage
[[plugins]]
  package = "./plugins/lighthouse-report-json"

[functions]
  directory = "netlify/functions"

# This workflow installs node dependencies, caches them, builds the source code and runs tests.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI

on:
  push:
    branches: [ "main", "feature" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-default:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - name: Create PR to main
      if: github.event_name == 'push' && github.ref != 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh pr create \
          --base main \
          --head "${GITHUB_REF_NAME}" \
          --title "Auto PR: ${GITHUB_REF_NAME}" \
          --body "Created automatically after CI build succeeded." \
          || echo "PR already exists or creation skipped"
